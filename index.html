<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ふたりの旅アルバム</title>
<meta name="theme-color" content="#f2ecdf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅アルバム">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2ecdf; --card:#fffdf8; --ink:#384233; --sub:#8b8775; --line:#e6dfcf;
  --green:#5b8a3a; --green-d:#3f5f2a; --land:#a9c77d; --land-d:#97b86a; --soft:#ebe4d4;
  --accent:#d98a3d; --shadow:0 3px 14px rgba(70,60,30,.10);
  --tabh:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.r{font-family:"M PLUS Rounded 1c","Noto Sans JP",sans-serif}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,textarea{font:inherit;color:inherit}
#app{max-width:720px;margin:0 auto;padding:0 16px calc(var(--tabh) + 28px + env(safe-area-inset-bottom))}

/* ヘッダー */
.top{display:flex;align-items:center;gap:10px;padding:calc(18px + env(safe-area-inset-top)) 0 12px;position:sticky;top:0;background:var(--bg);z-index:5}
.top h1{font-family:"M PLUS Rounded 1c";font-weight:800;font-size:21px;margin:0;flex:1;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.count{font-family:"M PLUS Rounded 1c";font-weight:700;font-size:13px;white-space:nowrap}
.count b{font-size:22px;font-weight:800;margin:0 2px;color:var(--green-d)}

/* 下タブ */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(440px,calc(100% - 24px));height:var(--tabh);background:rgba(255,253,248,.96);backdrop-filter:blur(8px);border-radius:24px;box-shadow:0 6px 24px rgba(60,50,20,.16);display:flex;z-index:20}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--sub);font-family:"M PLUS Rounded 1c"}
.tabbar button svg{width:26px;height:26px}
.tabbar button.on{color:var(--green-d)}
.tabbar button.on .ic{background:#e4eed6}
.tabbar .ic{width:44px;height:30px;border-radius:12px;display:flex;align-items:center;justify-content:center;transition:background .2s}

/* 地図 */
.mapcard{background:#f8f5ec;border-radius:24px;box-shadow:var(--shadow);position:relative;overflow:hidden;touch-action:none}
.mapcard svg{display:block;width:100%;height:auto;aspect-ratio:576/600;max-height:66vh;user-select:none;-webkit-user-select:none}
.mapcard path.pf{fill:var(--land);stroke:#fff;stroke-width:.7;stroke-linejoin:round;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .2s}
.mapcard path.pf.v{stroke:#fff;stroke-width:1.2}
.mapcard path.pf.sel{stroke:var(--accent);stroke-width:2.5}
.mapcard .oki{fill:none;stroke:#cfc7b2;stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:4 3}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;border-radius:12px;background:rgba(255,253,248,.95);box-shadow:var(--shadow);font-size:18px;font-weight:700;color:var(--ink)}
.maphint{position:absolute;left:12px;top:10px;font-size:11px;color:var(--sub);background:rgba(255,253,248,.85);padding:4px 9px;border-radius:999px}
.prefpop{position:absolute;left:12px;right:12px;bottom:12px;background:var(--card);border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.15);padding:10px;display:flex;gap:10px;align-items:center}
.prefpop img,.prefpop .ph{width:58px;height:58px;border-radius:12px;object-fit:cover;flex:none}
.prefpop .nm{font-family:"M PLUS Rounded 1c";font-weight:800;font-size:17px}
.prefpop .sb{font-size:12px;color:var(--sub);margin-top:2px}
.prefpop .go{margin-left:auto;background:var(--green);color:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;white-space:nowrap}

.pills{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.pill{background:var(--green-d);color:#fff;border-radius:999px;padding:9px 16px;font-family:"M PLUS Rounded 1c";font-weight:700;font-size:12px;box-shadow:var(--shadow)}
.pill b{font-size:20px;font-weight:800;margin-right:3px}
.sec{font-family:"M PLUS Rounded 1c";font-weight:800;font-size:17px;margin:22px 2px 10px;display:flex;align-items:baseline;gap:8px}
.sec small{font-size:13px;color:var(--sub);font-weight:700}
.abroad{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.abroad::-webkit-scrollbar{display:none}
.abroad button{flex:none;width:84px;text-align:center}
.abroad .circ{width:84px;height:84px;border-radius:50%;overflow:hidden;isolation:isolate;-webkit-mask-image:-webkit-radial-gradient(white,black);transform:translateZ(0);border:3px solid #fff;box-shadow:var(--shadow);background:var(--soft)}
.abroad img{width:100%;height:100%;object-fit:cover}
.abroad .nm{font-size:12px;font-weight:700;margin-top:6px;font-family:"M PLUS Rounded 1c"}
.abroad .sb{font-size:11px;color:var(--sub)}
.anniv{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:10px;display:flex;gap:12px;align-items:center;margin-top:14px;width:100%;text-align:left}
.anniv img,.anniv .ph{width:64px;height:64px;border-radius:14px;object-fit:cover;flex:none}
.anniv .t{font-size:12px;color:var(--accent);font-weight:700}
.anniv .m{font-family:"M PLUS Rounded 1c";font-weight:800;font-size:16px;margin-top:2px}

/* 写真一覧（地方ごと） */
.region{margin-bottom:6px}
.rhead{text-align:center;font-family:"M PLUS Rounded 1c";font-weight:800;font-size:17px;margin:22px 0 12px}
.rhead small{font-size:15px;color:var(--sub);margin-left:6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border-radius:10px;padding:7px 7px 8px;box-shadow:0 1px 4px rgba(0,0,0,.06);text-align:center}
.tile .im{aspect-ratio:1;border-radius:4px;overflow:hidden;isolation:isolate;-webkit-mask-image:-webkit-radial-gradient(white,black);transform:translateZ(0);background:var(--soft)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .nm{font-size:12px;font-weight:700;margin-top:7px}
.tile .ms{font-size:10px;color:var(--sub);margin-top:1px}
.notyet{text-align:center;color:var(--sub);font-size:12px;margin:26px 0 0;line-height:1.8}

/* 旅行カード */
.year{font-family:"M PLUS Rounded 1c";font-weight:800;font-size:15px;color:var(--sub);margin:20px 2px 10px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);text-align:left;display:block;width:100%;isolation:isolate;-webkit-mask-image:-webkit-radial-gradient(white,black);transform:translateZ(0)}
.card .cv{aspect-ratio:1;background:var(--soft);position:relative;overflow:hidden}
.card .cv img{width:100%;height:100%;object-fit:cover;display:block}
.card .cnt{position:absolute;right:7px;bottom:7px;background:rgba(0,0,0,.45);color:#fff;font-size:11px;border-radius:999px;padding:2px 8px}
.card .bd{padding:9px 11px 11px}
.card h3{margin:0;font-family:"M PLUS Rounded 1c";font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dt{font-size:12px;font-weight:700;color:var(--green-d);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .mt{font-size:11px;color:var(--sub);margin-top:3px;line-height:1.5}

/* 旅行詳細・県ページ */
.hero{border-radius:24px;overflow:hidden;position:relative;min-height:200px;background:var(--soft);box-shadow:var(--shadow);margin-top:4px;isolation:isolate;-webkit-mask-image:-webkit-radial-gradient(white,black);transform:translateZ(0)}
.hero img{position:relative;width:100%;height:auto;max-height:none;border-radius:24px;display:block}
.hero .ph{height:240px}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.55))}
.hero .tx{position:absolute;left:16px;right:16px;bottom:14px;color:#fff;z-index:1}
.hero .tt{font-family:"M PLUS Rounded 1c";font-weight:800;font-size:26px;background:transparent;border:0;color:#fff;width:100%;padding:0;outline:none}
.hero .mt{font-size:13px;opacity:.95;margin-top:2px}
.box{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px;margin-top:14px}
.lbl{font-size:12px;color:var(--sub);font-weight:700;display:block;margin-bottom:6px}
textarea{width:100%;border:1px solid var(--line);border-radius:14px;background:#fffaf1;padding:10px 12px;font-size:14px;line-height:1.7;resize:vertical;min-height:64px}
textarea:focus,input:focus{outline:2px solid #cfe0b8;border-color:transparent}
.route{width:100%;border-radius:14px;background:#f6f2e7;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:12px;font-weight:700}
.day{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px;margin-top:14px}
.day .dh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.day .dn{font-family:"M PLUS Rounded 1c";font-weight:800;font-size:19px}
.day .dd{font-size:12px;color:var(--sub)}
.day .rt{font-size:13px;margin:4px 0 10px}
.day .rt span{color:var(--sub)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.grid button{aspect-ratio:1;overflow:hidden;background:var(--soft);position:relative;border-radius:4px}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid .cvmark::after{content:"表紙";position:absolute;left:3px;top:3px;background:var(--green);color:#fff;font-size:10px;padding:1px 6px;border-radius:6px}
.grid .cm::before{content:"💬";position:absolute;right:3px;bottom:2px;font-size:12px}
.grid .gm2::after{content:"🍴";position:absolute;left:3px;bottom:2px;font-size:12px}
.grid .stk{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:700;border-radius:8px;padding:1px 7px}
.grid .cm .stk{bottom:20px}
.dedupe{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.sw{width:46px;height:28px;border-radius:999px;background:#d8d0bd;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--green)}.sw.on::after{left:21px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:#f7f5f0;align-items:center;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip span{font-size:11px;color:var(--sub);font-weight:700;flex:none;margin-right:2px}
.strip button{width:48px;height:48px;border-radius:8px;overflow:hidden;flex:none;opacity:.6;border:2px solid transparent}
.strip button.on{opacity:1;border-color:var(--green)}
.strip img{width:100%;height:100%;object-fit:cover}
.grid .chk{position:absolute;right:4px;top:4px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25)}
.grid .picked img{opacity:.6}
.grid .picked .chk{background:var(--green)}
.grid .picked .chk::after{content:"✓";color:#fff;font-size:13px;font-weight:800;position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 22px + env(safe-area-inset-bottom));width:min(440px,calc(100% - 24px));background:var(--ink);color:#fff;border-radius:18px;padding:10px 12px;display:flex;gap:8px;align-items:center;z-index:25;font-size:13px;font-weight:700}
.selbar{flex-direction:column;align-items:stretch;gap:8px}
.selbar .r1,.selbar .r2{display:flex;gap:8px;align-items:center}
.selbar .r1 span{flex:1}
.selbar .r2 .sbtn{flex:1;padding:10px 0;font-size:12.5px;white-space:nowrap;min-width:0}
.selbar .r2{gap:6px}
.selbtn{margin-left:auto;flex:none}
.grid button,.grid img{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.grid [data-pick-id]{touch-action:pan-y}
.grid [data-pick-id] img{pointer-events:none}
.selbar .sbtn{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
.selbar .delbtn{background:#c4553a;border-color:#c4553a}
.selbar .delbtn:disabled{opacity:.4}
.day textarea{min-height:42px;margin-top:10px;font-size:13px}
.day .bar{display:flex;justify-content:flex-end;margin-top:8px}
.mumapwrap{position:relative;border-radius:14px;overflow:hidden;background:#fbf9f3}
.mumap{display:block;width:100%;height:min(56vh,460px);touch-action:none;user-select:none;-webkit-user-select:none}
.mumapwrap .zoom{top:auto;bottom:8px;right:8px}
.wmapwrap{margin-bottom:12px;background:#eef3f6;box-shadow:var(--shadow);border-radius:20px}
.wmap{height:min(42vh,300px)}
.wland{fill:#c9dbab;stroke:#fff;stroke-width:.6;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.wc{stroke:#fff;stroke-width:2.5;vector-effect:non-scaling-stroke;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.wm{cursor:pointer}
.wl{text-anchor:middle;font-weight:800;fill:#384233;paint-order:stroke;stroke:rgba(255,255,255,.85);stroke-width:.3em;font-family:"M PLUS Rounded 1c",sans-serif;pointer-events:none}
.mumapwrap .zoom button{width:34px;height:34px}
.mumap .mu{stroke-width:.6;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer}
.mumap .mu.v{stroke-width:1.5}
.mumap .al{text-anchor:middle;dominant-baseline:middle;fill:#5d6b50;opacity:.75;font-weight:700;paint-order:stroke;stroke:rgba(255,255,255,.7);stroke-width:.25em;font-family:"M PLUS Rounded 1c",sans-serif}
.mumap .al.v{opacity:1;fill:#fff;stroke:rgba(0,0,0,.55);font-weight:800}
.mumap .mu.on{stroke:var(--accent);stroke-width:2.5}
.maptip{font-size:11px;color:var(--sub);text-align:center;margin:8px 0 4px}
.mgrp{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.mgrp b{font-size:12px;width:100%;color:var(--sub);margin-top:4px}
.mchip{background:var(--soft);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700}
.mchip small{margin-left:5px;color:var(--sub);font-weight:500}
.mchip.on{background:var(--green);color:#fff}
.mchip.on small{color:#e4eed6}
.gfil{margin:2px 0 12px}
.frow{display:flex;align-items:center;gap:8px;margin-top:6px}
.frow .ft{flex:none;width:44px;font-size:12px;font-weight:700;color:var(--sub)}
.fch{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:2px 0}
.fch::-webkit-scrollbar{display:none}
.fch .mchip{flex:none;white-space:nowrap}
.fres{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:var(--sub)}
.fres b{color:var(--ink,#333)}
.fres button{font-size:12px;font-weight:700;color:var(--green);padding:4px 6px}
.stars{display:inline-flex;gap:1px;vertical-align:-2px}
.st{position:relative;display:inline-block;width:14px;height:14px}
.st>svg{width:100%;height:100%;fill:#ddd3bf;display:block}
.st>span{position:absolute;left:0;top:0;height:100%;overflow:hidden;display:block}
.st>span>svg{width:14px;height:14px;fill:#e8a33c;display:block}
.stars.big .st,.stars.big .st>span>svg{width:20px;height:20px}
.tabs{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:999px;width:max-content}
.tabs button{padding:7px 16px;border-radius:999px;font-size:13px;font-weight:700;color:var(--sub);font-family:"M PLUS Rounded 1c"}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.glist{display:flex;flex-direction:column;gap:10px}
.gcard{display:flex;gap:12px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:10px;text-align:left;width:100%}
.gimg{width:84px;height:84px;border-radius:12px;overflow:hidden;flex:none;background:var(--soft);isolation:isolate;-webkit-mask-image:-webkit-radial-gradient(white,black);transform:translateZ(0)}
.gimg img{width:100%;height:100%;object-fit:cover}
.gimg .ph{font-size:28px}
.gb{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.gb b{font-family:"M PLUS Rounded 1c";font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm{font-size:12px;color:var(--sub)}
.gsc{font-size:12px;font-weight:800;color:#c98a24;margin-left:2px}
.gmemo{font-size:12px;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.gform{overflow-y:auto}
.gph{display:flex;gap:4px;overflow-x:auto;margin-bottom:12px;align-items:center}
.gph button{flex:none;padding:0;border-radius:8px;overflow:hidden}
.gpi{position:relative;flex:none}
.gpi .gx{position:absolute;right:2px;top:2px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:14px;line-height:22px;text-align:center}
.gadd{width:72px;height:72px;border:2px dashed var(--line)!important;background:var(--card);font-size:11px;font-weight:700;color:var(--green-d);line-height:1.3}
.pres .grid{grid-template-columns:repeat(4,1fr)}
.gph img,.gph .ph{width:72px;height:72px;border-radius:8px;object-fit:cover;flex:none;display:block}
.gph span{font-size:12px;color:var(--sub);padding:0 6px}
.gstars{display:flex;align-items:center;gap:4px}
.gstars button{width:44px;height:44px;padding:4px}
.gstars .st{width:36px;height:36px;pointer-events:none}.gstars .st>span>svg{width:36px;height:36px}
.gst{font-size:13px;color:var(--sub);margin-left:6px;font-weight:700}
.gplace{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;font-weight:700}
.pq.err{outline:2px solid #e6a08d}
.vgtag{display:flex;align-items:center;gap:8px;background:#fff6e8;padding:8px 14px;font-size:13px;font-weight:700;width:100%;text-align:left}
.ph{display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:var(--sub);font-size:11px;background:repeating-linear-gradient(45deg,var(--soft),var(--soft) 8px,#e5dcc9 8px,#e5dcc9 16px)}

/* 写真ビューア */
.vw{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column}
.vw .vt{display:flex;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;gap:10px;background:#f7f5f0}
.vw .vt .c{flex:1;text-align:center;line-height:1.25}
.vw .vt .c b{font-size:16px;font-family:"M PLUS Rounded 1c";font-weight:800;display:block}
.vw .vt .c span{font-size:11px;font-weight:700}
.vw .ph-area{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#ece7db;position:relative;overflow:hidden}
.vw .ph-area{touch-action:none}
.vw .ph-area img{width:100%;height:100%;object-fit:contain;transform-origin:center center;will-change:transform;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;pointer-events:none}
.vw .cmts{background:#f7f5f0;max-height:38vh;overflow-y:auto;padding:4px 0 calc(8px + env(safe-area-inset-bottom))}
.cmt{display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid #ebe6da}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;font-family:"M PLUS Rounded 1c"}
.cmt .w{font-size:12px;font-weight:700}
.cmt .w span{color:var(--sub);font-weight:400;margin-left:6px}
.cmt .x{font-size:14px;margin-top:2px;white-space:pre-wrap;word-break:break-word}
.cmt .del{margin-left:auto;color:var(--sub);font-size:12px;align-self:flex-start}
.addc{display:flex;gap:8px;align-items:center;padding:10px 12px}
.who{display:flex;background:var(--soft);border-radius:999px;padding:3px;flex:none}
.who button{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--sub)}
.who button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.addc input{flex:1;min-width:0;border:0;background:var(--card);border-radius:999px;padding:10px 14px;font-size:14px}
.send{background:var(--green);color:#fff;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700;flex:none}
.menu{position:absolute;right:14px;top:calc(58px + env(safe-area-inset-top));background:var(--card);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.18);overflow:hidden;z-index:2;min-width:210px}
.menu button{display:block;width:100%;text-align:left;padding:13px 16px;font-size:14px;border-bottom:1px solid var(--line)}
.menu button:last-child{border-bottom:0;color:#b5482f}
.navz{position:absolute;top:0;bottom:0;width:22%}
.navz.l{left:0}.navz.r{right:0}

/* 追加 */
.upl{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px 18px;text-align:center;border:2px dashed transparent}
.upl.drag{border-color:var(--green)}
.upl .big{font-size:40px}
.upl h2{font-family:"M PLUS Rounded 1c";font-weight:800;font-size:19px;margin:8px 0}
.upl p{font-size:13px;color:var(--sub);line-height:1.8;margin:0 0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:12px 20px;font-weight:700;font-size:14px;font-family:"M PLUS Rounded 1c"}
.btn.p{background:var(--green);color:#fff;box-shadow:0 4px 12px rgba(91,138,58,.3)}
.btn.s{background:var(--soft)}
.btns{display:flex;flex-direction:column;gap:10px;max-width:300px;margin:0 auto}
.tips{font-size:12px;color:var(--sub);line-height:1.8}
.tips b{color:var(--ink)}
.field{display:flex;gap:8px;align-items:center;margin-top:8px}
.field input{flex:1;border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#fffaf1;min-width:0}
.danger{color:#b5482f}

/* その他 */
.ov{position:fixed;inset:0;background:rgba(242,236,223,.94);z-index:60;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.ovpct{font-family:"M PLUS Rounded 1c";font-weight:800;font-size:34px;color:var(--green-d);line-height:1}
.ov .bar2{width:240px;height:8px;background:#e1d9c6;border-radius:99px;overflow:hidden}
.ov .bar2 i{display:block;height:100%;background:var(--green);width:0;transition:width .2s}
.ov .bar2 i.busy{width:35%!important;animation:busy 1.1s ease-in-out infinite alternate}
@keyframes busy{from{margin-left:0}to{margin-left:65%}}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 26px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:70;opacity:0;transition:opacity .25s;pointer-events:none;width:max-content;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.syncpill{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top));background:rgba(56,66,51,.88);color:#fff;font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;z-index:30;pointer-events:none}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px}
.dlg .in{background:var(--card);border-radius:20px;padding:20px;max-width:340px;width:100%}
.dlg .pk{max-width:420px;max-height:86vh;display:flex;flex-direction:column}
.pq{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fffaf1;font-size:15px}
.pres{overflow-y:auto;margin-top:10px;max-height:52vh;-webkit-overflow-scrolling:touch}
.pr{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;padding:10px 6px;border-bottom:1px solid var(--line)}
.pr b{font-size:15px}.pr span{font-size:11px;color:var(--sub);margin-top:1px}
.pg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pgt{width:100%;font-size:12px;font-weight:700;color:var(--sub);margin-top:4px}
.pc{background:var(--soft);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700}
.pc.wide{background:#e4eed6;color:var(--green-d)}
.pback{font-size:13px;color:var(--green-d);font-weight:700;margin-bottom:6px}
.phd{font-family:"M PLUS Rounded 1c";font-weight:800;font-size:18px;margin-bottom:8px}
.pe{font-size:12px;color:var(--sub);padding:8px 2px;line-height:1.7}
.dlg h3{margin:0 0 8px;font-family:"M PLUS Rounded 1c";font-weight:800}
.dlg p{font-size:13px;color:var(--sub);line-height:1.7;margin:0 0 16px}
.dlg .row{display:flex;gap:8px;justify-content:flex-end}
.okitabs{margin:0 auto 10px}
.mumapwrap.nolbl .lbls{display:none}
.mumap .ldr{stroke:#5d6b50;stroke-width:1;opacity:.55}
.mumapwrap .zoom button[data-mz="lbl"]:not(.on){opacity:.55;text-decoration:line-through}
.dlg .sbtn.p{background:var(--green);color:#fff;border-color:var(--green);padding:9px 16px;font-size:13px}
.hidden{display:none!important}
.empty{text-align:center;color:var(--sub);font-size:13px;line-height:1.9;padding:40px 10px}

/* 位置情報のない写真の場所を補う：手動設定 ＞ 同じ旅の近い時間の写真から推定 */
function applyPlaces(){
  for(const tr of S.trips){
    const geo=tr.ids.map(P_).filter(p=>p.gps);
    for(const id of tr.ids){
      const p=P_(id);if(p.gps){p.place=p.gps;p.how=null;continue;}
      const m=manualOf(id);
      if(m){p.place=m;p.how="manual";continue;}
      let best=null,bd=6*H;
      for(const g of geo){const d=Math.abs(g.t-p.t);if(d<bd){bd=d;best=g;}}
      if(best){p.place={...best.gps};p.how="guess";}else{p.place=null;p.how=null;}
    }
  }
}

let PIDX=null;
function placeIndexForPick(){
  if(PIDX)return PIDX;
  const L=[],seen=new Set(),add=(o)=>{const k=o.label+"|"+o.desc;if(seen.has(k))return;seen.add(k);L.push(o);};
  areaData().list.forEach(a=>add({t:0,label:a.name,desc:[fullPref(a.pref),a.sub].filter(Boolean).join(" ")+" のエリア",val:{pref:a.pref,sub:a.sub,area:a.name}}));
  const subs=[...new Set(muniData().filter(m=>m.pref==="北海道"&&m.sub).map(m=>m.sub))];
  subs.forEach(sb=>add({t:1,label:sb,desc:"北海道（エリア全体）",val:{pref:"北海道",sub:sb}}));
  Object.keys(JP_REG).forEach(k=>add({t:2,label:fullPref(k),desc:"県全体",val:{pref:k}}));
  muniData().forEach(m=>add({t:3,label:m.part?m.name+"・"+m.area.name:m.name,desc:`${fullPref(m.pref)} → ${m.area.name}エリア`,val:{pref:m.pref,sub:m.sub,area:m.area.name}}));
  const ab=[...new Set(PLACES.filter(p=>!isJP(p[0])).map(p=>p[0]))];
  ab.forEach(a=>add({t:0,label:a,desc:"海外",val:{pref:a}}));
  PLACES.filter(p=>!isJP(p[0])&&p[1]!==p[0]).forEach(p=>add({t:0,label:p[1],desc:p[0],val:{pref:p[0],area:p[1]}}));
  return PIDX=L;
}

/* 場所を選ぶ：検索、または 都道府県 → エリア の順にタップ */
function pickPlace(title,msg,cur,onOk,ctxPref){
  if(typeof cur==="string")cur={pref:cur};
  const d=document.createElement("div");d.className="dlg";
  d.innerHTML=`<div class="in pk"><h3>${esc(title)}</h3><p>${esc(msg)}</p>

  document.body.appendChild(d);
  const q=d.querySelector("#pq"),res=d.querySelector("#pres");
  let browse=ctxPref||(cur&&cur.pref)||null;
  const choose=v=>{d.remove();onOk(v);};
  const row=o=>`<button class="pr" data-v='${esc(JSON.stringify(o.val))}'><b>${esc(o.label)}</b><span>${esc(o.desc)}</span></button>`;
  const chip=(label,val,cls="")=>`<button class="pc ${cls}" data-v='${esc(JSON.stringify(val))}'>${esc(label)}</button>`;
  const draw=()=>{
    const qq=toKata(q.value.trim());

    if(qq){
      const r=placeIndexForPick().filter(o=>toKata(o.label).includes(qq)||toKata(o.desc).includes(qq)&&o.t===1);
      r.sort((a,b)=>(toKata(b.label).startsWith(qq)-toKata(a.label).startsWith(qq))||a.t-b.t);
      h=r.length?r.slice(0,40).map(row).join(""):`<div class="pe">見つかりませんでした。別の書き方（漢字・カタカナ）で探してみてください。</div>`;
    }else if(browse&&isJP(browse)){
      const areas=placeIndexForPick().filter(o=>o.t===0&&o.val.pref===browse&&o.val.area);
      h=`<button class="pback" data-browse="">‹ 都道府県を選び直す</button><div class="phd">${esc(fullPref(browse))}</div>`;

        h+=subs.map(sb=>{const a=areas.filter(o=>o.val.sub===sb);return `<div class="pg"><div class="pgt">${esc(sb)}</div>${chip(sb+"エリア",{pref:"北海道",sub:sb},"wide")}${a.map(o=>chip(o.label,o.val)).join("")}</div>`;}).join("");

      h+=`<div class="pg">${chip(fullPref(browse)+"（細かい場所は決めない）",{pref:browse},"wide")}</div><div class="pe">ここにない地名は、上の検索で市区町村名からも探せます（近くのエリアに入ります）。</div>`;
    }else{
      h=REGIONS.map(r=>`<div class="pg"><div class="pgt">${regionTitle(r)}</div>${Object.keys(JP_REG).filter(k=>JP_REG[k]===r).map(k=>`<button class="pc" data-browse="${k}">${fullPref(k)}</button>`).join("")}</div>`).join("");

      h+=`<div class="pg"><div class="pgt">海外</div>${ab.map(a=>chip(a,{pref:a})).join("")}</div>`;

}

/* --- 県（場所）ページ --- */
function muniMapSVG(pref,e){

  }[pref];

    ms.forEach(m=>{const v=e.munis[m.area.name];if(v){const g=MG.grp(m);cnt[g]=Math.max(cnt[g]||0,v.ids.length);}});

    okiKey="|"+pick;
  }
  if(!ms.length)return "";
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;ms.forEach(m=>{x0=Math.min(x0,m.bb[0]);x1=Math.max(x1,m.bb[2]);y0=Math.min(y0,m.bb[1]);y1=Math.max(y1,m.bb[3]);});
  const k=Math.cos((y0+y1)/2*Math.PI/180),Sc=100;
  const P=([x,y])=>[(x-x0)*k*Sc,(y1-y)*Sc];

    const d=mm.map(m=>m.rings.map(r=>"M"+r.map(q=>{const [u,v]=P(q);bx0=Math.min(bx0,u);bx1=Math.max(bx1,u);by0=Math.min(by0,v);by1=Math.max(by1,v);return u.toFixed(1)+","+v.toFixed(1);}).join("L")+"Z").join("")).join("");
    {const inMu=a.lat!=null&&mm.some(m=>a.lon>=m.bb[0]-.05&&a.lon<=m.bb[2]+.05&&a.lat>=m.bb[1]-.05&&a.lat<=m.bb[3]+.05);
     if(inMu){[cx,cy]=P([a.lon,a.lat]);}
     else{const bigM=mm.reduce((b,m)=>{const ar=(m.bb[2]-m.bb[0])*(m.bb[3]-m.bb[1]);return ar>b.ar?{m,ar}:b;},{m:mm[0],ar:-1}).m;[cx,cy]=P([bigM.cx,bigM.cy]);}}

      if(cov){const id="ap"+ai;defs+=`<pattern id="${id}" patternUnits="userSpaceOnUse" x="${bx0}" y="${by0}" width="${bx1-bx0}" height="${by1-by0}"><image href="${cov.thumb}" x="0" y="0" width="${bx1-bx0}" height="${by1-by0}" preserveAspectRatio="xMidYMid slice"/></pattern>`;fill=`url('#${id}')`;}

function routeSVG(days){

  let x0=Math.min(...allP.map(p=>p[0])),x1=Math.max(...allP.map(p=>p[0])),y0=Math.min(...allP.map(p=>p[1])),y1=Math.max(...allP.map(p=>p[1]));
  let w=Math.max(x1-x0,14),h=Math.max(y1-y0,10);
  const cx=(x0+x1)/2,cy=(y0+y1)/2;
  if(w/h<1.6)w=h*1.6;else h=w/1.6;w*=1.35;h*=1.35;
  const vb=[cx-w/2,cy-h/2,w,h];const sw=w/320;
  let base="";
  if(jp)base=Object.keys(JP).map(k=>`<path d="${JP[k]}" fill="#dfe8cf" stroke="#fff" stroke-width="${sw*1.2}"/>`).join("");
  let lines="",dots="",labels="";const seen=new Set();
  days.forEach((d,n)=>{
    const col=DAY_COLORS[n%DAY_COLORS.length],p=pts(d);
    if(p.length>1)lines+=`<polyline points="${p.map(q=>q.map(v=>v.toFixed(2)).join(",")).join(" ")}" fill="none" stroke="${col}" stroke-width="${sw*2.4}" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>`;
    p.forEach(q=>dots+=`<circle cx="${q[0].toFixed(2)}" cy="${q[1].toFixed(2)}" r="${sw*3}" fill="${col}" stroke="#fff" stroke-width="${sw}"/>`);
    d.ps.forEach(ph=>{if(ph.lat==null||!ph.place)return;const s=lbl(ph.place);if(seen.has(s))return;seen.add(s);const q=jp?proj(ph.lon,ph.lat):[ph.lon*C36*40,-ph.lat*40];labels+=`<text x="${(q[0]+sw*5).toFixed(2)}" y="${(q[1]-sw*4).toFixed(2)}" font-size="${sw*11}" font-weight="700" fill="#384233" stroke="#f6f2e7" stroke-width="${sw*3}" paint-order="stroke">${esc(s)}</text>`;});
  });
  return `<svg class="route" viewBox="${vb.join(" ")}">${base}${lines}${dots}${labels}</svg>`;

/* アプリの写真から選ぶ画面（お店の日付の前後の写真を先に表示） */
function choosePhotos(g,back){
  const have=new Set(g.photos||[]);
  const all=[...S.photos.values()].filter(p=>!have.has(p.id)&&!p.id.startsWith("demo-"));
  const near=all.filter(p=>Math.abs(p.t-g.t)<2*DAY).sort((a,b)=>a.t-b.t);
  const sameTrip=(()=>{const tr=S.trips.find(t=>(g.photos||[]).some(x=>t.ids.includes(x)));return tr?tr.ids.map(P_).filter(p=>p&&!have.has(p.id)):[];})();
  let list=[...new Map([...sameTrip,...near].map(p=>[p.id,p])).values()].sort((a,b)=>a.t-b.t);
  let showAll=false;const picked=new Set();
  const d=document.createElement("div");d.className="dlg";
  const draw=()=>{
    const src=showAll?all.sort((a,b)=>b.t-a.t):list;
    d.innerHTML=`<div class="in pk"><h3>追加する写真を選ぶ</h3><p>${showAll?"すべての写真（新しい順）":"お店に行った日の前後の写真"}・タップで選択</p>
      <div class="pres"><div class="grid">${src.map(p=>`<button data-cp="${esc(p.id)}" class="${picked.has(p.id)?"picked":""}">${img(p)}<span class="chk"></span></button>`).join("")||`<div class="pe">写真が見つかりませんでした</div>`}</div></div>
      <div class="row" style="margin-top:10px;justify-content:space-between">${showAll?"":`<button class="sbtn" data-all>ほかの日の写真も見る</button>`}<span style="flex:1"></span><button class="sbtn" data-x>やめる</button><button class="sbtn" data-ok style="background:var(--green);color:#fff;border-color:var(--green)">${picked.size?picked.size+"枚を追加":"追加"}</button></div></div>`;
    d.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>{const x=b.dataset.cp;picked.has(x)?picked.delete(x):picked.add(x);b.classList.toggle("picked",picked.has(x));d.querySelector("[data-ok]").textContent=picked.size?picked.size+"枚を追加":"追加";});
    const al=d.querySelector("[data-all]");if(al)al.onclick=()=>{showAll=true;draw();};
    d.querySelector("[data-x]").onclick=()=>{d.remove();back();};
    d.querySelector("[data-ok]").onclick=()=>{g.photos=[...(g.photos||[]),...picked];d.remove();if(picked.size)toast(`${picked.size}枚を追加しました（保存を押すと記録されます）`);back();};
  };
  draw();document.body.appendChild(d);
}

function gRegion(g){return !g.pref?null:isJP(g.pref)?JP_REG[g.pref]:"海外";}
function gYear(g){return new Date(g.t).getFullYear();}
function vGourmet(){
  const all=Object.values(G_()).filter(g=>!g.del);
  const F=S.gF=S.gF||{};
  /* 選ばれている条件が、もう存在しなければ外す */
  const years=[...new Set(all.map(gYear))].sort((a,b)=>b-a);
  if(F.y&&!years.includes(F.y))F.y=null;
  const byY=all.filter(g=>!F.y||gYear(g)===F.y);
  const regs=[...REGIONS,"海外"].filter(r=>byY.some(g=>gRegion(g)===r));
  if(F.r&&!regs.includes(F.r)){F.r=null;F.p=null;F.a=null;}
  const byR=byY.filter(g=>!F.r||gRegion(g)===F.r);
  const prefs=[...new Set(byR.map(g=>g.pref).filter(Boolean))];
  if(F.p&&!prefs.includes(F.p)){F.p=null;F.a=null;}
  const byP=byR.filter(g=>!F.p||g.pref===F.p);
  const areaOf=g=>areaFix(g.pref,g.area)||g.sub||"";
  const ep=F.p||(F.r&&prefs.length===1?prefs[0]:null);
  const areas=[...new Set(byP.map(areaOf).filter(Boolean))];
  if(F.a&&!areas.includes(F.a))F.a=null;
  let list=byP.filter(g=>!F.a||areaOf(g)===F.a);
  list.sort(S.gSort==="stars"?(a,b)=>(b.stars-a.stars)||(b.t-a.t):(a,b)=>b.t-a.t);
  const cnt=(arr,fn,v)=>arr.filter(g=>fn(g)===v).length;
  const chip=(k,v,label,on,n)=>`<button class="mchip${on?" on":""}" data-gf="${k}" data-v="${esc(String(v))}">${esc(label)}${n!=null?`<small>${n}</small>`:""}</button>`;
  const row=(title,chips)=>`<div class="frow"><span class="ft">${title}</span><div class="fch">${chips}</div></div>`;
  const anyF=F.y||F.r||F.p||F.a;
  const card=g=>{const ps=(g.photos||[]).map(P_).filter(Boolean),c=ps[0];
    return `<button class="gcard" data-g="${esc(g.id)}"><div class="gimg">${c?img(c):`<div class="ph">🍴</div>`}</div><div class="gb"><b>${esc(g.name)}</b><div>${starsHtml(g.stars)} <span class="gsc">${starText(g.stars)}</span></div><div class="gm">${esc(gPlaceText(g))}・${new Date(g.t).getFullYear()}年${new Date(g.t).getMonth()+1}月</div>${g.memo?`<div class="gmemo">${esc(g.memo)}</div>`:""}</div></button>`;};
  return `<div class="top"><h1>グルメ</h1><div class="count"><b>${all.length}</b>軒</div></div>
  ${all.length?`<div class="gbar"><div class="tabs" style="margin:0"><button data-gsort="new" class="${S.gSort!=="stars"?"on":""}">新しい順</button><button data-gsort="stars" class="${S.gSort==="stars"?"on":""}">評価順</button></div></div>
  <div class="gfil">
    ${years.length>1?row("年",chip("y","",`すべて`,!F.y)+years.map(y=>chip("y",y,y+"年",F.y===y,cnt(all,gYear,y))).join("")):""}
    ${regs.length>1||F.r?row("地域",chip("r","","すべて",!F.r)+regs.map(r=>chip("r",r,r,F.r===r,cnt(byY,gRegion,r))).join("")):""}
    ${(F.r&&prefs.length>1)||F.p?row(F.r==="海外"?"国・地域":"県",chip("p","","すべて",!F.p)+prefs.map(k=>chip("p",k,fullPref(k),F.p===k,cnt(byR,g=>g.pref,k))).join("")):""}
    ${ep&&(areas.length>1||F.a)?row("エリア",chip("a","","すべて",!F.a)+areas.map(a=>chip("a",a,a,F.a===a,cnt(byP,areaOf,a))).join("")):""}
    ${anyF?`<div class="fres"><span><b>${list.length}</b>軒を表示中</span><button data-gclr>条件をクリア</button></div>`:""}
  </div>
  ${list.length?"":`<div class="empty">この条件に合うお店はありません。</div>`}
  <div class="glist">${list.map(card).join("")}</div>`:`<div class="empty">まだお店の記録がありません。</div>`}
  <div class="box tips"><b>お店の登録のしかた</b><br>
    ・料理の写真を開いて、右上の「…」→「グルメに登録」<br>
    ・何枚かまとめて：写真を長押し（または「選択」）で選んで、下の「グルメ」<br>
    県・エリア・日付は写真から自動で入ります。店名と星を入れてください。</div>
  <div style="text-align:center;margin-top:12px"><button class="sbtn" data-gnew>＋ 写真なしでお店を追加</button></div>`;
}

/* ================= 同じ写真（重複）の判定 =================
   撮影日時と見た目（指紋）がほぼ同じなら同じ写真とみなす。
   1/1000秒まで記録がある写真同士は、連写と区別するため時刻の一致を厳しく見る */
function isDup(a,b){
  if(!a||!b||a.id===b.id||a.dateGuess||b.dateGuess||!a.h||!b.h)return false;
  const both=a.sub&&b.sub,dt=Math.abs(a.t-b.t);
  if(both){if(dt>15)return false;}else if(Math.floor(a.t/1000)!==Math.floor(b.t/1000))return false;
  if(a.lat!=null&&b.lat!=null&&km(a.lat,a.lon,b.lat,b.lon)>0.3)return false;
  return hamming(a.h,b.h)<=(both?8:3);
}
function dupIndex(){const m=new Map();for(const p of S.photos.values()){if(p.dateGuess||!p.h)continue;const k=Math.floor(p.t/1000);(m.get(k)||m.set(k,[]).get(k)).push(p);}return m;}
function findDup(p,idx){const k=Math.floor(p.t/1000);for(const d of [k-1,k,k+1])for(const q of (idx.get(d)||[]))if(isDup(p,q))return q;return null;}
/* drop を keep にまとめる（コメント・表紙・代表写真・場所の設定を引き継いでから drop を消す） */
function mergeDup(keep,drop){
  const a=META.cmt[drop.id];if(a){const b=META.cmt[keep.id]||(META.cmt[keep.id]=[]);for(const c of a)if(!b.some(x=>x.at===c.at&&x.x===c.x))b.push(c);b.sort((x,y)=>x.at-y.at);}
  for(const id in META.trip)if(META.trip[id].cover===drop.id)META.trip[id].cover=keep.id;
  for(const k in META.prefCover)if(META.prefCover[k]===drop.id)META.prefCover[k]=keep.id;
  if(META.manual[drop.id]&&!META.manual[keep.id])META.manual[keep.id]=META.manual[drop.id];
  for(const gid in META.gourmet){const g=META.gourmet[gid];if(g.photos&&g.photos.includes(drop.id)){g.photos=g.photos.map(x=>x===drop.id?keep.id:x).filter((x,i,a)=>a.indexOf(x)===i);g.u=Date.now();sync("gourmet",gid);}}
  removePhotos([drop.id]);
}
/* すでに入っている写真の中の重複をまとめる（2人とも同じ結果になるよう、IDの小さい方を残す） */
function dedupeAll(){
  const idx=dupIndex();let n=0;const gone=new Set();
  for(const list of idx.values()){
    for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
      const a=list[i],b=list[j];if(gone.has(a.id)||gone.has(b.id))continue;
      if(isDup(a,b)){const [keep,drop]=a.id<b.id?[a,b]:[b,a];mergeDup(keep,drop);gone.add(drop.id);n++;}
    }
  }
  return n;
}

async function* readLines(file){
  if(file.stream&&window.TextDecoderStream){
    const r=file.stream().pipeThrough(new TextDecoderStream()).getReader();let buf="";
    for(;;){const {value,done}=await r.read();if(done)break;buf+=value;let i;while((i=buf.indexOf("\n"))>=0){yield buf.slice(0,i);buf=buf.slice(i+1);}}
    if(buf.trim())yield buf;
  }else{for(const l of (await file.text()).split("\n"))if(l.trim())yield l;}
}
async function importFile(file){
  let header=null,n=0,added=0;const got=[];
  const est=Math.max(1,Math.round(file.size/450000));
  try{
    for await(const line of readLines(file)){
      if(!line.trim())continue;
      const o=JSON.parse(line);
      if(!header){if(o.type!=="tabi-album"){toast("旅アルバムのファイルではないようです");return;}header=o;continue;}
      n++;setOv("受け取った写真を取り込んでいます…",`${n}枚目`,Math.min(1,n/est));
      const r=o.p;if(!r||!r.id)continue;
      if(S.photos.has(r.id)){const p=P_(r.id);if(!p.thumb&&r.thumbU){p.thumb=r.thumbU;}continue;}
      const rec={...r,added:Date.now(),fromPartner:true};
      dbPut("photos",rec);if(o.f)dbPut("full",{id:r.id,u:o.f});
      const p=hydrate(rec);p.fromPartner=true;S.photos.set(p.id,p);got.push(p);added++;
    }
  }catch(e){hideOv();toast("ファイルを読み込めませんでした");return;}
  if(!header){hideOv();toast("旅アルバムのファイルではないようです");return;}
  // メモ・コメントなどを合わせる（こちらの内容は消さない）
  const m=header.meta||{};
  for(const id in (m.trip||{})){
    const a=tmeta(id),b=m.trip[id];
    if(!a.name&&b.name)a.name=b.name;
    if(b.memo&&!(a.memo||"").includes(b.memo))a.memo=a.memo?a.memo+"\n\n"+b.memo:b.memo;
    if(b.days){a.days=a.days||{};for(const k in b.days){const x=b.days[k];if(x&&!(a.days[k]||"").includes(x))a.days[k]=a.days[k]?a.days[k]+"\n"+x:x;}}
    if(!a.cover&&b.cover)a.cover=b.cover;
  }
  for(const id in (m.cmt||{})){
    const a=META.cmt[id]||(META.cmt[id]=[]);
    for(const c of m.cmt[id])if(!a.some(x=>x.at===c.at&&x.x===c.x))a.push(c);
    a.sort((x,y)=>x.at-y.at);
  }
  for(const k in (m.prefCover||{}))if(!META.prefCover[k])META.prefCover[k]=m.prefCover[k];
  for(const k in (m.manual||{}))if(!META.manual[k])META.manual[k]=m.manual[k];
  for(const k in (m.split||{}))META.split[k]=true;
  for(const k in (m.gourmet||{})){const a=META.gourmet[k],b=m.gourmet[k];if(!a||(b.u||0)>(a.u||0)){if(b.del)delete META.gourmet[k];else META.gourmet[k]=b;}}

  const placed=new Set();
  for(const t of (header.trips||[])){
    const ids=t.ids.filter(id=>S.photos.has(id));if(!ids.length)continue;
    let tr=S.trips.find(x=>x.id===t.id)||S.trips.find(x=>x.ids.some(id=>ids.includes(id)));
    const fresh=ids.filter(id=>!S.trips.some(x=>x.ids.includes(id)));
    if(!fresh.length)continue;
    if(tr){tr.ids.push(...fresh);sortTrip(tr);}else S.trips.push({id:t.id,ids:fresh});
    fresh.forEach(id=>placed.add(id));
  }
  const rest=got.filter(p=>!placed.has(p.id)&&!S.trips.some(x=>x.ids.includes(p.id)));
  if(rest.length)addToTrips(rest);
  autoMerge();sortTrips();saveTrips();saveMeta();hideOv();sync("upload",got.map(p=>p.id));
  toast(`${header.from||"相手"}から写真${added}枚を取り込みました${n-added>0?`（${n-added}枚は取り込み済み）`:""}`);
  (async()=>{for(const p of got)if(!p.h&&p.thumb){const an=await analyze(p.thumb);if(an)Object.assign(p,an);}})();
  S.tab="map";S.stack=[];render();
}

/* ================= iPhoneの写真に保存 =================

function exifJpeg(bytes,t,lat,lon){

      else{head.push(...u32(dOff+data.length));data.push(...val);if(data.length%2)data.push(0);}}

  const exifOff=8+size0,exifB=build([[0x9003,2,20,asc(ds)],[0x9004,2,20,asc(ds)]],exifOff);

}

  let shown=false;
  const back=()=>{if(!picking||shown||Date.now()-picking<600)return;setTimeout(()=>{if(!picking||shown)return;shown=true;showWait();},250);};
  const showWait=()=>{
    setOv("選んだ写真を受け取っています…","",0);$("#ovPct").textContent="";$("#ovBar").classList.add("busy");$("#ovCancel").classList.remove("hidden");

      $("#ovSub").innerHTML="iPhoneが写真をアプリに渡す準備をしています。<br>枚数が多いと少し時間がかかります。届きはじめると、ここに何枚目か（％）を表示します。"+(sec>90?"<br><b>時間がかかっています。iCloudから写真を取り寄せている可能性があります。1回に選ぶ枚数を減らす（100〜200枚）と早くなります。</b>":"");
      if(sec>900){picking=0;hideOv();}},500);};
  const off=()=>{window.removeEventListener("focus",back);document.removeEventListener("visibilitychange",vis);window.removeEventListener("pageshow",back);};
  const vis=()=>{if(document.visibilityState==="visible")back();};
  window.addEventListener("focus",back);document.addEventListener("visibilitychange",vis);window.addEventListener("pageshow",back);
  setTimeout(off,20*60*1000);
}

if(CFG&&CFG.apiKey)boot().catch(e=>{ST.on=true;ST.err="同期の準備に失敗しました（"+(e&&e.message||e)+"）";refreshAdd();});
async function boot(){

    upload:ids=>{ids.forEach(id=>{if(!id.startsWith("demo-"))upQ.add(id);});ST.pending=upQ.size;pill();pumpUp();},
    removed:ids=>{if(!ST.user)return;ids.filter(id=>!id.startsWith("demo-")).forEach(id=>{const k=key(id);upQ.delete(id);
      setDoc(doc(db,ROOT+"/photos",k),{id,del:true,u:Date.now()}).catch(()=>{});deleteDoc(doc(db,ROOT+"/thumbs",k)).catch(()=>{});deleteDoc(doc(db,ROOT+"/full",k)).catch(()=>{});});},
    trip:id=>{if(!ST.user)return;clearTimeout(tT[id]);tT[id]=setTimeout(()=>{const m=META.trip[id]||{};
      setDoc(doc(db,ROOT+"/tripmeta",key(id)),{id,name:m.name||null,memo:m.memo||null,days:m.days||null,cover:m.cover||null,del:false,u:Date.now(),dev:DEV}).catch(e=>{ST.err=fsMsg(e);});},800);},
    gourmet:id=>{if(!ST.user)return;const g=META.gourmet[id];if(!g)return;const body=JSON.parse(JSON.stringify(g));body.u=Date.now();body.dev=DEV;
      setDoc(doc(db,ROOT+"/gourmet",key(id)),body).catch(e=>{ST.err=fsMsg(e);});},
    tripDel:id=>{if(!ST.user)return;setDoc(doc(db,ROOT+"/tripmeta",key(id)),{id,del:true,u:Date.now(),dev:DEV}).catch(()=>{});},
    comment:(pid,c,del)=>{if(!ST.user||!c)return;setDoc(doc(db,ROOT+"/comments",c.at+"_"+c.w),{pid,w:c.w,x:c.x,at:c.at,del:!!del,u:Date.now()}).catch(e=>{ST.err=fsMsg(e);});},
    settings:()=>{if(!ST.user)return;clearTimeout(sT);sT=setTimeout(()=>{

    ST.pending=upQ.size;pill();pumpUp();pumpThumbs();
    // 旅のメモ・設定がまだクラウドにない場合は、このスマホの内容を送っておく
    if(!localStorage.getItem("tabi-seeded")){localStorage.setItem("tabi-seeded","1");Object.keys(META.trip).forEach(id=>window.SYNC.trip(id));
      for(const pid in META.cmt)for(const c of META.cmt[pid])window.SYNC.comment(pid,c);window.SYNC.settings();}
  }
}
</script>

if("serviceWorker" in navigator&&location.protocol==="https:"){try{navigator.serviceWorker.register("sw.js");}catch(e){}}
</script>
